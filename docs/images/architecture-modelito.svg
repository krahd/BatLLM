<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="920" viewBox="0 0 1640 920" role="img" aria-labelledby="title desc">
  <title id="title">BatLLM modelito architecture</title>
  <desc id="desc">Application surfaces, configuration, the BatLLM LLM facade, modelito, and the local Ollama runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .box { fill: #ffffff; stroke: #29465b; stroke-width: 2.2; rx: 12; }
      .module { fill: #ecf6ff; }
      .state { fill: #f7f2ff; }
      .adapter { fill: #edf9f1; }
      .runtime { fill: #fff7e8; }
      .title { font: 700 30px Arial, sans-serif; fill: #10212d; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #4f6472; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #132b3c; }
      .body { font: 400 15px Arial, sans-serif; fill: #263238; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2.4; marker-end: url(#arrow); }
      .label { font: 700 13px Arial, sans-serif; fill: #314452; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1640" height="920"/>
  <text class="title" x="60" y="60">BatLLM modelito integration architecture</text>
  <text class="subtitle" x="60" y="92">The Kivy tools share one configuration layer and route local-model work through the BatLLM LLM facade before delegating to modelito.</text>

  <rect class="box module" x="60" y="150" width="330" height="150"/>
  <text class="box-title" x="84" y="190">Launchers</text>
  <text class="body" x="84" y="224">
    <tspan x="84" dy="0">run_batllm.py</tspan>
    <tspan x="84" dy="22">run_game_analyzer.py</tspan>
    <tspan x="84" dy="22">run_tests.py</tspan>
  </text>

  <rect class="box state" x="60" y="380" width="330" height="205"/>
  <text class="box-title" x="84" y="420">Config And State</text>
  <text class="body" x="84" y="452">
    <tspan x="84" dy="0">src/configs/config.yaml</tspan>
    <tspan x="84" dy="22">app_config.py overlays</tspan>
    <tspan x="84" dy="22">saved sessions</tspan>
    <tspan x="84" dy="22">analyzer replay data</tspan>
    <tspan x="84" dy="22">timeout overrides</tspan>
    <tspan x="84" dy="22">last_served_model</tspan>
  </text>

  <rect class="box state" x="60" y="690" width="330" height="150"/>
  <text class="box-title" x="84" y="730">Configurator Tooling</text>
  <text class="body" x="84" y="762">
    <tspan x="84" dy="0">src/configs/configurator.py</tspan>
    <tspan x="84" dy="22">local model utilities</tspan>
    <tspan x="84" dy="22">console stream</tspan>
  </text>

  <rect class="box module" x="500" y="145" width="390" height="185"/>
  <text class="box-title" x="524" y="185">Gameplay Surface</text>
  <text class="body" x="524" y="217">
    <tspan x="524" dy="0">GameBoard builds prompt history</tspan>
    <tspan x="524" dy="22">OllamaConnector sends messages</tspan>
    <tspan x="524" dy="22">HistoryManager stores outcomes</tspan>
    <tspan x="524" dy="22">saved sessions stay replayable</tspan>
  </text>

  <rect class="box module" x="500" y="405" width="390" height="165"/>
  <text class="box-title" x="524" y="445">Analyzer Surface</text>
  <text class="body" x="524" y="477">
    <tspan x="524" dy="0">analyzer_main.py replay UI</tspan>
    <tspan x="524" dy="22">shared save file contracts</tspan>
    <tspan x="524" dy="22">prompt and response inspection</tspan>
  </text>

  <rect class="box adapter" x="990" y="145" width="340" height="235"/>
  <text class="box-title" x="1014" y="185">BatLLM LLM Facade</text>
  <text class="body" x="1014" y="217">
    <tspan x="1014" dy="0">src/llm/service.py</tspan>
    <tspan x="1014" dy="22">src/llm/ollama.py</tspan>
    <tspan x="1014" dy="22">shipped config overlays</tspan>
    <tspan x="1014" dy="22">common model timeouts</tspan>
    <tspan x="1014" dy="22">remote timeout catalogue</tspan>
    <tspan x="1014" dy="22">CLI lifecycle helper</tspan>
  </text>

  <rect class="box adapter" x="1370" y="145" width="230" height="235"/>
  <text class="box-title" x="1394" y="185">modelito</text>
  <text class="body" x="1394" y="217">
    <tspan x="1394" dy="0">Client.summarize()</tspan>
    <tspan x="1394" dy="22">OllamaProvider</tspan>
    <tspan x="1394" dy="22">inspect_service_state</tspan>
    <tspan x="1394" dy="22">list_local_models</tspan>
    <tspan x="1394" dy="22">list_remote_models</tspan>
    <tspan x="1394" dy="22">download_model_progress</tspan>
  </text>

  <rect class="box runtime" x="1080" y="640" width="430" height="170"/>
  <text class="box-title" x="1104" y="680">Local Ollama Runtime</text>
  <text class="body" x="1104" y="712">
    <tspan x="1104" dy="0">real local Ollama server</tspan>
    <tspan x="1104" dy="22">installed model set</tspan>
    <tspan x="1104" dy="22">warm, download, delete</tspan>
    <tspan x="1104" dy="22">serve, stop and start</tspan>
  </text>

  <path class="arrow" d="M390 225 H500"/>
  <text class="label" x="445" y="214">launch</text>

  <path class="arrow" d="M390 275 C445 275 445 488 500 488"/>
  <text class="label" x="440" y="367">launch</text>

  <path class="arrow" d="M390 482 H500"/>
  <text class="label" x="445" y="471">shared config</text>

  <path class="arrow" d="M390 765 H960 V350 H990"/>
  <text class="label" x="655" y="754">config-driven tooling</text>

  <path class="arrow" d="M890 235 H990"/>
  <text class="label" x="940" y="224">prompt lifecycle policy</text>

  <path class="arrow" d="M890 490 C940 490 940 315 990 315"/>
  <text class="label" x="940" y="472">replay compatibility</text>

  <path class="arrow" d="M1330 260 H1370"/>
  <text class="label" x="1350" y="249">delegate</text>

  <path class="arrow" d="M1485 380 V640"/>
  <text class="label" x="1560" y="505">service calls</text>

  <path class="arrow" d="M1160 380 V640"/>
  <text class="label" x="1236" y="515">status and CLI</text>

  <path class="arrow" d="M890 300 C950 300 950 725 1080 725"/>
  <text class="label" x="990" y="614">prompt/model ops</text>
</svg>
