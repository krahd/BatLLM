<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="940" viewBox="0 0 1640 940" role="img" aria-labelledby="title desc">
  <title id="title">BatLLM local model request flow</title>
  <desc id="desc">The path from selecting or downloading an Ollama model to gameplay prompts, provider responses, parsing, and replay storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #29465b; stroke-width: 2.2; rx: 12; }
      .decision { fill: #fff9e6; stroke: #8a6d1d; stroke-width: 2.2; }
      .runtime { fill: #fff2df; }
      .state { fill: #f4f0ff; }
      .title { font: 700 30px Arial, sans-serif; fill: #10212d; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #4f6472; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #132b3c; }
      .body { font: 400 15px Arial, sans-serif; fill: #263238; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2.4; marker-end: url(#arrow); }
      .label { font: 700 13px Arial, sans-serif; fill: #314452; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1640" height="940"/>
  <text class="title" x="60" y="60">Local model request and replay flow</text>
  <text class="subtitle" x="60" y="92">Model selection, readiness checks, downloads, gameplay prompts, and saved sessions share one modelito-backed path.</text>

  <rect class="box state" x="60" y="160" width="290" height="160"/>
  <text class="box-title" x="84" y="198">
    <tspan x="84" dy="0">1. Select Or Refresh</tspan>
    <tspan x="84" dy="24">A Model</tspan>
  </text>
  <text class="body" x="84" y="254">
    <tspan x="84" dy="0">Ollama screen or configurator</tspan>
    <tspan x="84" dy="22">refreshes local inventory</tspan>
    <tspan x="84" dy="22">or remote catalogue</tspan>
  </text>

  <polygon class="decision" points="590,150 750,255 590,360 430,255"/>
  <text class="box-title" x="590" y="244" text-anchor="middle">Local Model</text>
  <text class="box-title" x="590" y="268" text-anchor="middle">Available?</text>

  <rect class="box" x="860" y="130" width="370" height="205"/>
  <text class="box-title" x="884" y="168">2A. Serve Existing Model</text>
  <text class="body" x="884" y="200">
    <tspan x="884" dy="0">save llm.model</tspan>
    <tspan x="884" dy="22">resolve timeout through</tspan>
    <tspan x="884" dy="22">src/llm/service.py</tspan>
    <tspan x="884" dy="22">modelito readiness check</tspan>
    <tspan x="884" dy="22">record last_served_model</tspan>
  </text>

  <rect class="box" x="860" y="405" width="370" height="190"/>
  <text class="box-title" x="884" y="443">2B. Download Remote Model</text>
  <text class="body" x="884" y="475">
    <tspan x="884" dy="0">modelito download progress</tspan>
    <tspan x="884" dy="22">update status and output log</tspan>
    <tspan x="884" dy="22">refresh local list</tspan>
    <tspan x="884" dy="22">model becomes playable</tspan>
  </text>

  <rect class="box runtime" x="1370" y="245" width="210" height="350"/>
  <text class="box-title" x="1394" y="283">Local Ollama</text>
  <text class="body" x="1394" y="315">
    <tspan x="1394" dy="0">real local server</tspan>
    <tspan x="1394" dy="22">installed models</tspan>
    <tspan x="1394" dy="22">warm and pull</tspan>
    <tspan x="1394" dy="22">delete safeguards</tspan>
    <tspan x="1394" dy="22">serve/stop/start</tspan>
    <tspan x="1394" dy="22">provider responses</tspan>
  </text>

  <rect class="box" x="60" y="680" width="360" height="180"/>
  <text class="box-title" x="84" y="718">3. Player Prompt</text>
  <text class="body" x="84" y="750">
    <tspan x="84" dy="0">GameBoard builds prompt</tspan>
    <tspan x="84" dy="22">and history</tspan>
    <tspan x="84" dy="22">OllamaConnector maps</tspan>
    <tspan x="84" dy="22">messages to modelito</tspan>
    <tspan x="84" dy="22">timeout policy applies</tspan>
  </text>

  <rect class="box" x="520" y="680" width="380" height="180"/>
  <text class="box-title" x="544" y="718">4. Provider Call</text>
  <text class="body" x="544" y="750">
    <tspan x="544" dy="0">OllamaProvider or</tspan>
    <tspan x="544" dy="22">Client.summarize()</tspan>
    <tspan x="544" dy="22">same path used by</tspan>
    <tspan x="544" dy="22">smoke helpers and CLI</tspan>
    <tspan x="544" dy="22">returns assistant text</tspan>
  </text>

  <rect class="box state" x="1080" y="680" width="440" height="180"/>
  <text class="box-title" x="1104" y="718">5. Parse And Persist</text>
  <text class="body" x="1104" y="750">
    <tspan x="1104" dy="0">gameplay response is parsed</tspan>
    <tspan x="1104" dy="22">into actions and narrative</tspan>
    <tspan x="1104" dy="22">HistoryManager stores</tspan>
    <tspan x="1104" dy="22">prompts and outcomes</tspan>
    <tspan x="1104" dy="22">analyzer replay stays valid</tspan>
  </text>

  <path class="arrow" d="M350 255 H430"/>
  <text class="label" x="396" y="244">refresh</text>

  <path class="arrow" d="M750 255 H860"/>
  <text class="label" x="805" y="244">local</text>

  <path class="arrow" d="M590 360 V500 H860"/>
  <text class="label" x="725" y="489">download</text>

  <path class="arrow" d="M1230 270 H1370"/>
  <text class="label" x="1300" y="259">warm/inspect</text>

  <path class="arrow" d="M1230 500 H1370"/>
  <text class="label" x="1300" y="489">pull model</text>

  <path class="arrow" d="M1475 595 V640 H710 V680"/>
  <text class="label" x="1160" y="630">response text</text>

  <path class="arrow" d="M420 770 H520"/>
  <text class="label" x="470" y="759">prompt</text>

  <path class="arrow" d="M900 770 H1080"/>
  <text class="label" x="990" y="759">record outcome</text>

  <path class="arrow" d="M860 315 C740 360 690 625 250 625 V680"/>
  <text class="label" x="540" y="610">after model is ready</text>
</svg>
