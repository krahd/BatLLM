name: Publish final audited URUCON package

on:
  push:
    branches: [urucon]
    paths:
      - research/urucon2026/.final-publish-trigger

permissions:
  contents: write

concurrency:
  group: urucon-branch-writer
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BATLLM_RUN_OLLAMA_SMOKE: "0"
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      KIVY_WINDOW: mock
      PYTHONPATH: src
      AUDIT_LOG: research/urucon2026/FINAL_AUDIT.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: urucon
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and rendering tools
        shell: bash
        run: |
          set -o pipefail
          : > "$AUDIT_LOG"
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              pandoc poppler-utils libreoffice-writer \
              texlive-latex-base texlive-latex-recommended \
              texlive-latex-extra texlive-publishers \
              texlive-fonts-recommended
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install -r research/urucon2026/requirements.txt
          } 2>&1 | tee -a "$AUDIT_LOG"

      - name: Validate hardened implementation
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src research/urucon2026/experiments \
              run_batllm.py run_game_analyzer.py run_tests.py \
              run_batllm_research.py run_batllm_verify.py
            python -m pytest -q src/tests
          } 2>&1 | tee -a "$AUDIT_LOG"

      - name: Regenerate complete evaluation artefact
        shell: bash
        run: |
          set -o pipefail
          python research/urucon2026/experiments/run_all.py \
            2>&1 | tee -a "$AUDIT_LOG"

      - name: Build and preflight British-English PDF
        working-directory: research/urucon2026/paper
        shell: bash
        run: |
          set -euo pipefail
          rm -f main.aux main.log main.pdf
          pdflatex -interaction=nonstopmode -halt-on-error main.tex | tee -a "$GITHUB_WORKSPACE/$AUDIT_LOG"
          pdflatex -interaction=nonstopmode -halt-on-error main.tex | tee -a "$GITHUB_WORKSPACE/$AUDIT_LOG"
          pdflatex -interaction=nonstopmode -halt-on-error main.tex | tee -a "$GITHUB_WORKSPACE/$AUDIT_LOG"
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -ge 4
          test "$pages" -le 5
          ! grep -q 'Citation.*undefined' main.log
          ! grep -q 'There were undefined references' main.log
          ! grep -q 'LaTeX Error' main.log
          ! grep -q 'Overfull' main.log
          pdftotext main.pdf /tmp/urucon-paper.txt
          grep -q 'ACKNOWLEDGEMENT' /tmp/urucon-paper.txt
          pdffonts main.pdf | awk 'NR > 2 && NF > 0 {if ($4 != "yes") exit 1}'
          mkdir -p /tmp/pdf-render
          pdftoppm -png -r 150 main.pdf /tmp/pdf-render/page >/dev/null
          test "$(find /tmp/pdf-render -name 'page-*.png' | wc -l)" -eq "$pages"

      - name: Build and render editable British-English DOCX
        shell: bash
        run: |
          set -euo pipefail
          python research/urucon2026/paper/build_docx.py | tee -a "$AUDIT_LOG"
          unzip -t research/urucon2026/paper/main.docx | tee -a "$AUDIT_LOG"
          python - <<'PY'
          from docx import Document
          path = 'research/urucon2026/paper/main.docx'
          doc = Document(path)
          assert doc.core_properties.language == 'en-GB'
          assert any(p.text == 'Acknowledgement' for p in doc.paragraphs)
          assert len(doc.tables) == 2
          PY
          mkdir -p /tmp/docx-render
          libreoffice --headless --convert-to pdf --outdir /tmp/docx-render \
            research/urucon2026/paper/main.docx 2>&1 | tee -a "$AUDIT_LOG"
          test -s /tmp/docx-render/main.pdf
          pages=$(pdfinfo /tmp/docx-render/main.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -ge 4
          pdftoppm -png -r 120 /tmp/docx-render/main.pdf \
            /tmp/docx-render/page >/dev/null
          test "$(find /tmp/docx-render -name 'page-*.png' | wc -l)" -eq "$pages"

      - name: Package complete research artefact
        shell: bash
        run: |
          set -euo pipefail
          cat > research/urucon2026/FINAL_AUDIT_STATUS.md <<'EOF'
          # Final URUCON audit status

          Status: complete.

          The hardened source, complete non-live test suite, deterministic experiments, British-English four-page PDF, editable en-GB DOCX, render preflights, manifests, and packaged research artefact all passed their release gates.
          EOF
          rm -f research/urucon2026/.final-publish-trigger \
            research/urucon2026/.audit-trigger \
            research/urucon2026/.publish-trigger
          python research/urucon2026/build_artifact.py | tee -a "$AUDIT_LOG"

      - name: Commit and push final deliverables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f \
            research/urucon2026/FINAL_AUDIT_STATUS.md \
            research/urucon2026/FINAL_AUDIT.log \
            research/urucon2026/corpus/generated \
            research/urucon2026/results \
            research/urucon2026/paper/main.log \
            research/urucon2026/paper/main.pdf \
            research/urucon2026/paper/main.docx \
            research/urucon2026/paper/BatLLM_URUCON_2026_Paper.pdf \
            research/urucon2026/paper/BatLLM_URUCON_2026_Paper.docx \
            research/urucon2026/paper/results.tex \
            research/urucon2026/artifact
          git commit -m 'artifacts: publish final audited URUCON package [skip ci]'
          git push origin HEAD:urucon

      - name: Record failure on branch
        if: failure()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp "$AUDIT_LOG" /tmp/FINAL_AUDIT.log 2>/dev/null || true
          git reset --hard HEAD
          cp /tmp/FINAL_AUDIT.log "$AUDIT_LOG" 2>/dev/null || : > "$AUDIT_LOG"
          cat > research/urucon2026/FINAL_AUDIT_STATUS.md <<'EOF'
          # Final URUCON audit status

          Status: failed. See `FINAL_AUDIT.log`. Generated deliverables were not declared final.
          EOF
          git add -f research/urucon2026/FINAL_AUDIT_STATUS.md \
            research/urucon2026/FINAL_AUDIT.log
          git commit -m 'audit: record final URUCON publication failure [skip ci]' || true
          git push origin HEAD:urucon || true
