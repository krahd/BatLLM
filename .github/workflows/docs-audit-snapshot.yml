name: Documentation audit snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs-audit-snapshot.yml"
      - ".github/DOCS_AUDIT_SNAPSHOT"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/batllm-docs-audit.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: batllm-docs-audit
          path: /tmp/batllm-docs-audit.tar.gz
          retention-days: 1
