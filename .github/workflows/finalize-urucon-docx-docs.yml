name: Finalize URUCON DOCX documentation

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/finalize-urucon-docx-docs.yml"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/urucon-docx-authoritative
          fetch-depth: 0

      - name: Make the Word-first status explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          status = root / 'STATUS.md'
          text = status.read_text(encoding='utf-8')
          start = '## 2026-07-22: URUCON 2026 Research Artefact'
          end = '## Setup And Run Instructions'
          replacement = '''## 2026-07-22: URUCON 2026 Research Artefact

BatLLM includes a distinct schema-v3 research execution path for the paper *From Prompt to State: Verifiable Grounding and Operative Replay for LLM-Mediated Control*. The graphical application continues to export schema v2; the paper's claims concern the explicit headless schema-v3 recorder and verifier.

- Authoritative manuscript: `research/urucon2026/paper/BatLLM_URUCON_2026_Paper.docx`, maintained directly in Microsoft Word using the IEEE A4 conference template.
- Retained template: `research/urucon2026/paper/conference-template-a4.docx`.
- No LaTeX source, generated PDF, conversion script, bibliography source, or duplicate `main.docx` is retained in the paper directory.
- Word validation checks DOCX integrity, en-GB metadata, IEEE styles, A4 geometry, page count, equations, tables, citations, and absence of template guidance text. Any PDF used by CI is temporary and is not committed.
- New entry points: `run_batllm_research.py` records scripted or local-Ollama traces; `run_batllm_verify.py` validates and replays schema-v3 sessions.
- Research package: `research/urucon2026/` contains the JSON Schema, deterministic corpus, independent reference semantics, differential and perturbation experiments, claim ledger, adversarial reviews, Word manuscript, retained template, and generated result summaries.
- Boundaries: the work does not claim deterministic regeneration of model output, provider-wire capture, generic agent replay, pedagogical efficacy, or cryptographic authorship. SHA-256 values are consistency commitments rather than signatures.

'''
          pattern = re.compile(re.escape(start) + r'.*?(?=' + re.escape(end) + r')', re.S)
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'expected one STATUS section, found {count}')
          status.write_text(updated, encoding='utf-8')

          note = (
              '> **Current format (July 2026).** The sole authoritative manuscript is '
              '`paper/BatLLM_URUCON_2026_Paper.docx`, maintained directly in Microsoft Word '
              'with the retained IEEE A4 template. References below to LaTeX, generated PDFs, '
              'or conversion scripts describe earlier audit stages and are retained only as '
              'historical context.\n\n'
          )
          for relative in (
              'research/urucon2026/PAPER_STYLE_AUDIT.md',
              'research/urucon2026/AUDIT.md',
              'research/urucon2026/FINAL_AUDIT_STATUS.md',
              'research/urucon2026/PAPER_REVIEW.md',
          ):
              path = root / relative
              source = path.read_text(encoding='utf-8')
              if '**Current format (July 2026).**' in source:
                  continue
              lines = source.splitlines(keepends=True)
              insert_at = 1
              while insert_at < len(lines) and not lines[insert_at].strip():
                  insert_at += 1
              lines.insert(insert_at, '\n' + note)
              path.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Remove this one-time workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-urucon-docx-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md research/urucon2026/*.md
          git diff --cached --check
          git commit -m "docs: make URUCON Word manuscript status explicit"
          git push origin HEAD:agent/urucon-docx-authoritative
