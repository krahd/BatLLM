name: Refresh URUCON software artefact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/refresh-urucon-artifact.yml"

concurrency:
  group: refresh-urucon-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Build software research artefact
        run: python research/urucon2026/build_artifact.py

      - name: Validate manuscript separation
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("research/urucon2026")
          package = root / "artifact/BatLLM_URUCON_2026_Research_Artifact.zip"
          manifest = root / "artifact/MANIFEST.sha256"
          package_hash = root / "artifact/PACKAGE.sha256"
          for path in (package, manifest, package_hash):
              assert path.is_file() and path.stat().st_size > 0, path

          forbidden = {
              "research/urucon2026/paper/BatLLM_URUCON_2026_Paper.docx",
              "research/urucon2026/PAPER_REVIEW.md",
              "research/urucon2026/PAPER_STYLE_AUDIT.md",
              "research/urucon2026/DOCX_MIGRATION.md",
          }
          with ZipFile(package) as archive:
              names = set(archive.namelist())
              assert archive.testzip() is None
          assert "research/urucon2026/paper/README.md" in names
          assert not (forbidden & names), forbidden & names

          manifest_text = manifest.read_text(encoding="utf-8")
          for path in forbidden:
              assert path not in manifest_text
          assert "research/urucon2026/paper/README.md" in manifest_text
          PY

      - name: Commit refreshed artefact and remove workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-urucon-artifact.yml
          git add research/urucon2026/artifact
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh URUCON software research artefact"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
