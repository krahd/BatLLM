name: Refresh URUCON software artefact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/refresh-urucon-artifact.yml"

concurrency:
  group: refresh-urucon-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Build software research artefact
        run: python research/urucon2026/build_artifact.py

      - name: Validate clean paper boundary
        run: |
          set -euo pipefail
          test "$(find research/urucon2026/paper -maxdepth 1 -type f | wc -l)" -eq 1
          test -s research/urucon2026/paper/README.md
          grep -q 'krahd/academic-writing' research/urucon2026/paper/README.md
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("research/urucon2026")
          package = root / "artifact/BatLLM_URUCON_2026_Research_Artifact.zip"
          manifest = root / "artifact/MANIFEST.sha256"
          package_hash = root / "artifact/PACKAGE.sha256"
          for path in (package, manifest, package_hash):
              assert path.is_file() and path.stat().st_size > 0, path

          with ZipFile(package) as archive:
              assert archive.testzip() is None
              paper_names = sorted(
                  name for name in archive.namelist()
                  if name.startswith("research/urucon2026/paper/")
              )
          assert paper_names == ["research/urucon2026/paper/README.md"], paper_names

          manifest_paper_lines = [
              line for line in manifest.read_text(encoding="utf-8").splitlines()
              if "research/urucon2026/paper/" in line
          ]
          assert len(manifest_paper_lines) == 1, manifest_paper_lines
          assert manifest_paper_lines[0].endswith("research/urucon2026/paper/README.md")
          PY

      - name: Commit refreshed artefact and remove workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-urucon-artifact.yml
          git add research/urucon2026/artifact
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh URUCON software research artefact"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
