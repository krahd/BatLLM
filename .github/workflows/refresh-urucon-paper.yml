name: Refresh URUCON paper artefacts

on:
  push:
    branches: [urucon-paper-prose-audit]
    paths:
      - ".github/workflows/refresh-urucon-paper.yml"
      - "research/urucon2026/paper/main.tex"
      - "research/urucon2026/paper/references.bib"
      - "research/urucon2026/PAPER_STYLE_AUDIT.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/refresh-urucon-paper.yml"
      - "research/urucon2026/**"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      KIVY_WINDOW: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: urucon-paper-prose-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pandoc poppler-utils unzip \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-publishers \
            texlive-fonts-recommended
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r research/urucon2026/requirements.txt
          python -m pip install python-docx

      - name: Build and preflight PDF
        working-directory: research/urucon2026/paper
        run: |
          set -euo pipefail
          rm -f main.aux main.log main.pdf
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -eq 4
          ! grep -q 'Citation.*undefined' main.log
          ! grep -q 'There were undefined references' main.log
          ! grep -q 'LaTeX Error' main.log
          ! grep -q 'Overfull' main.log
          pdfinfo main.pdf
          pdffonts main.pdf

      - name: Build and preflight DOCX
        run: |
          python research/urucon2026/paper/build_docx.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path = Path('research/urucon2026/paper/main.docx')
          assert path.exists() and path.stat().st_size > 0
          with ZipFile(path) as archive:
              assert archive.testzip() is None
              assert 'word/document.xml' in archive.namelist()
          PY

      - name: Refresh complete research package
        run: python research/urucon2026/build_artifact.py

      - name: Commit generated artefacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/urucon2026/paper/main.pdf \
            research/urucon2026/paper/main.log \
            research/urucon2026/paper/main.docx \
            research/urucon2026/paper/BatLLM_URUCON_2026_Paper.pdf \
            research/urucon2026/paper/BatLLM_URUCON_2026_Paper.docx \
            research/urucon2026/artifact/MANIFEST.sha256 \
            research/urucon2026/artifact/PACKAGE.sha256 \
            research/urucon2026/artifact/BatLLM_URUCON_2026_Research_Artifact.zip
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh URUCON generated artefacts [skip ci]"
            git push origin HEAD:urucon-paper-prose-audit
          fi
