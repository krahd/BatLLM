name: Apply PR 44 audit closure

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/PR44_AUDIT_CLOSURE"
      - ".github/workflows/apply-pr44-audit-closure.yml"

permissions:
  contents: write

concurrency:
  group: apply-pr44-audit-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.head_ref == 'fix-pr44-final'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIVY_WINDOW: mock
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      PYTHONPATH: src
      BATLLM_RUN_OLLAMA_SMOKE: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-pr44-final
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Retrieve deterministic patch script
        run: |
          git fetch origin fix-pr44-audit-closure
          git show origin/fix-pr44-audit-closure:tools/apply_pr44_audit_closure.py > tools/apply_pr44_audit_closure.py
      - name: Apply deterministic patch
        run: python tools/apply_pr44_audit_closure.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements.txt >/dev/null
          python -m pip install -r research/urucon2026/requirements.txt >/dev/null
          python -m pip install pytest "pylint>=4,<5" >/dev/null
      - name: Compile maintained sources
        run: python -m compileall -q src run_batllm.py run_game_analyzer.py run_tests.py run_batllm_research.py run_batllm_verify.py create_release_bundles.py create_homebrew_formula.py validate_packaging_smoke.py research/urucon2026/experiments
      - name: Run complete non-live suite
        shell: bash
        run: |
          set +e
          python -m pytest -q src/tests > /tmp/pytest.log 2>&1
          code=$?
          tail -n 160 /tmp/pytest.log
          exit $code
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr44-remediation-pytest
          path: /tmp/pytest.log
          if-no-files-found: error
          retention-days: 1
      - name: Run full Pylint gate
        run: python -m pylint src run_batllm.py run_game_analyzer.py create_release_bundles.py create_homebrew_formula.py
      - name: Run complete research pipeline
        run: python research/urucon2026/experiments/run_all.py
      - name: Check patch integrity
        run: git diff --check
      - name: Remove temporary automation
        run: rm -f .github/PR44_AUDIT_CLOSURE tools/apply_pr44_audit_closure.py .github/workflows/apply-pr44-audit-closure.yml
      - name: Commit validated remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close remaining PR 44 audit findings"
          git push origin HEAD:fix-pr44-final
