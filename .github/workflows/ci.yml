name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      BATLLM_RUN_OLLAMA_SMOKE: "0"
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      KIVY_WINDOW: mock
      PYTHONPATH: src
      VENV_PYTHON: ${{ runner.os == 'Windows' && './.venv_BatLLM/Scripts/python.exe' || './.venv_BatLLM/bin/python' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Create venv
        run: |
          python -m venv .venv_BatLLM
      - name: Install dependencies
        run: |
          "$VENV_PYTHON" -m pip install --upgrade pip
          "$VENV_PYTHON" -m pip install -r requirements.txt
          "$VENV_PYTHON" -m pip install pytest pylint
      - name: Compile sources
        run: |
          "$VENV_PYTHON" -m compileall -q src run_batllm.py run_game_analyzer.py run_tests.py create_release_bundles.py create_homebrew_formula.py validate_packaging_smoke.py
      - name: Run tests
        run: |
          "$VENV_PYTHON" run_tests.py non-live
      - name: Run pylint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          "$VENV_PYTHON" -m pylint src run_batllm.py run_game_analyzer.py create_release_bundles.py create_homebrew_formula.py
