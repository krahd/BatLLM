name: URUCON research validation

on:
  push:
    branches: [urucon]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      BATLLM_RUN_OLLAMA_SMOKE: "0"
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      KIVY_WINDOW: mock
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r research/urucon2026/requirements.txt
      - name: Compile all maintained entry points
        run: |
          python -m compileall -q src run_batllm.py run_game_analyzer.py run_tests.py run_batllm_research.py run_batllm_verify.py create_release_bundles.py create_homebrew_formula.py validate_packaging_smoke.py research/urucon2026/experiments
      - name: Validate schema JSON syntax
        run: python -m json.tool research/urucon2026/schema/batllm-session-v3.schema.json
      - name: Run complete non-live test suite
        run: python -m pytest -q src/tests
      - name: Generate and verify research artefact
        shell: bash
        run: |
          set +e
          python research/urucon2026/experiments/run_all.py > research-run.log 2>&1
          code=$?
          cat research-run.log
          exit $code
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urucon-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            research-run.log
            research/urucon2026/results
          if-no-files-found: warn
          retention-days: 7

  research-artifact:
    name: Reproducibility artefact and paper
    runs-on: ubuntu-latest
    needs: tests
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      KIVY_WINDOW: mock
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r research/urucon2026/requirements.txt
      - name: Generate reference results
        run: python research/urucon2026/experiments/run_all.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-publishers \
            texlive-fonts-recommended poppler-utils
      - name: Compile and preflight paper
        working-directory: research/urucon2026/paper
        run: |
          set -euo pipefail
          rm -f main.aux main.log main.pdf
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          echo "Compiled page count: $pages"
          test "$pages" -le 5
          test "$pages" -ge 4
          ! grep -q 'Citation.*undefined' main.log
          ! grep -q 'There were undefined references' main.log
          ! grep -q 'LaTeX Error' main.log
          ! grep -q 'Overfull' main.log
          pdfinfo main.pdf
          pdffonts main.pdf
      - name: Upload reproducibility artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urucon-research-artifact
          path: |
            research/urucon2026/results
            research/urucon2026/corpus/generated
            research/urucon2026/paper/main.pdf
            research/urucon2026/paper/main.log
            research/urucon2026/paper/main.tex
            research/urucon2026/paper/references.bib
            research/urucon2026/paper/results.tex
            research/urucon2026/schema/batllm-session-v3.schema.json
            research/urucon2026/requirements.txt
            research/urucon2026/README.md
            research/urucon2026/CLAIMS.md
            research/urucon2026/PAPER_REVIEW.md
            research/urucon2026/AUDIT.md
          if-no-files-found: warn
          retention-days: 30
