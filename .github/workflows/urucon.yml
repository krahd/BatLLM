name: URUCON research validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/urucon.yml"
      - "research/urucon2026/**"
      - "src/game/replay_engine.py"
      - "src/game/research_runtime.py"
      - "src/game/session_v3.py"
      - "src/game/trace_contract.py"
      - "src/game/trace_verifier.py"
      - "src/tests/test_trace_contract.py"
      - "src/tests/test_replay_engine.py"
      - "src/tests/test_game_analyzer.py"
      - "run_batllm_research.py"
      - "run_batllm_verify.py"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/urucon.yml"
      - "research/urucon2026/**"
      - "src/game/replay_engine.py"
      - "src/game/research_runtime.py"
      - "src/game/session_v3.py"
      - "src/game/trace_contract.py"
      - "src/game/trace_verifier.py"
      - "src/tests/test_trace_contract.py"
      - "src/tests/test_replay_engine.py"
      - "src/tests/test_game_analyzer.py"
      - "run_batllm_research.py"
      - "run_batllm_verify.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      BATLLM_RUN_OLLAMA_SMOKE: "0"
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      KIVY_WINDOW: mock
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r research/urucon2026/requirements.txt
      - name: Compile all maintained entry points
        run: |
          python -m compileall -q src run_batllm.py run_game_analyzer.py run_tests.py run_batllm_research.py run_batllm_verify.py create_release_bundles.py create_homebrew_formula.py validate_packaging_smoke.py research/urucon2026/experiments
      - name: Validate schema JSON syntax
        run: python -m json.tool research/urucon2026/schema/batllm-session-v3.schema.json
      - name: Run complete non-live test suite
        run: python -m pytest -q src/tests
      - name: Generate and verify research artefact
        shell: bash
        run: |
          set +e
          python research/urucon2026/experiments/run_all.py > research-run.log 2>&1
          code=$?
          cat research-run.log
          exit $code
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urucon-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            research-run.log
            research/urucon2026/results
          if-no-files-found: warn
          retention-days: 7

  research-artifact:
    name: Reproducibility artefact and Word paper
    runs-on: ubuntu-latest
    needs: tests
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      KIVY_WINDOW: mock
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r research/urucon2026/requirements.txt
      - name: Generate reference results
        run: python research/urucon2026/experiments/run_all.py
      - name: Install Word-rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-writer poppler-utils fonts-liberation
      - name: Validate authoritative DOCX
        run: |
          set -euo pipefail
          paper="research/urucon2026/paper/BatLLM_URUCON_2026_Paper.docx"
          template="research/urucon2026/paper/conference-template-a4.docx"
          test -s "$paper"
          test -s "$template"
          test -z "$(find research/urucon2026/paper -maxdepth 1 -type f \
            \( -name '*.tex' -o -name '*.bib' -o -name '*.log' -o -name '*.pdf' \) -print -quit)"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from docx import Document

          paper = Path("research/urucon2026/paper/BatLLM_URUCON_2026_Paper.docx")
          template = Path("research/urucon2026/paper/conference-template-a4.docx")
          for path in (paper, template):
              with ZipFile(path) as archive:
                  assert archive.testzip() is None, path
                  assert "word/document.xml" in archive.namelist(), path

          doc = Document(paper)
          text = "\n".join(paragraph.text for paragraph in doc.paragraphs)
          assert "From Prompt to State" in text
          assert "Applications that let a large language model control software" in text
          forbidden = (
              "This electronic document is a ‘live’ template",
              'This electronic document is a "live" template',
              "Paper Title* (use style: paper title)",
              "IEEE conference templates contain guidance text",
          )
          assert not any(fragment in text for fragment in forbidden)
          assert len(doc.tables) == 2
          assert len(doc.sections) >= 2
          assert doc.core_properties.language == "en-GB"
          PY
          rm -rf /tmp/urucon-paper /tmp/libreoffice-home
          mkdir -p /tmp/urucon-paper /tmp/libreoffice-home
          HOME=/tmp/libreoffice-home libreoffice --headless \
            --convert-to pdf --outdir /tmp/urucon-paper "$paper"
          rendered="/tmp/urucon-paper/BatLLM_URUCON_2026_Paper.pdf"
          test -s "$rendered"
          pages=$(pdfinfo "$rendered" | awk '/^Pages:/ {print $2}')
          width=$(pdfinfo "$rendered" | awk '/^Page size:/ {print $3}')
          height=$(pdfinfo "$rendered" | awk '/^Page size:/ {print $5}')
          echo "Rendered page count: $pages"
          test "$pages" -ge 3
          test "$pages" -le 5
          awk -v w="$width" 'BEGIN { exit !(w > 594 && w < 597) }'
          awk -v h="$height" 'BEGIN { exit !(h > 840 && h < 843) }'
          pdftotext "$rendered" /tmp/urucon-paper/paper.txt
          grep -q "From Prompt to State" /tmp/urucon-paper/paper.txt
          ! grep -q "Paper Title.*use style" /tmp/urucon-paper/paper.txt
          pdfinfo "$rendered"
      - name: Build research package
        run: python research/urucon2026/build_artifact.py
      - name: Upload reproducibility artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urucon-research-artifact
          path: |
            research/urucon2026/results
            research/urucon2026/corpus/generated
            research/urucon2026/paper/BatLLM_URUCON_2026_Paper.docx
            research/urucon2026/paper/conference-template-a4.docx
            research/urucon2026/paper/README.md
            research/urucon2026/schema/batllm-session-v3.schema.json
            research/urucon2026/requirements.txt
            research/urucon2026/README.md
            research/urucon2026/CLAIMS.md
            research/urucon2026/PAPER_REVIEW.md
            research/urucon2026/PAPER_STYLE_AUDIT.md
            research/urucon2026/AUDIT.md
            research/urucon2026/artifact/MANIFEST.sha256
            research/urucon2026/artifact/PACKAGE.sha256
            research/urucon2026/artifact/BatLLM_URUCON_2026_Research_Artifact.zip
          if-no-files-found: error
          retention-days: 30
